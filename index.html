<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Responsive MCQ Screen</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      :root {
        --border-size: 10px;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #f5f7fb;
      }

      .app-root {
        height: 100dvh;
        padding: clamp(8px, 1.5vmin, 16px);
      }

      .quiz-shell {
        --question-basis: 35%;
        position: relative;
        height: 100%;
        width: 100%;
        border: var(--border-size) solid #212529;
        border-radius: 1rem;
        background: linear-gradient(160deg, #ffffff 30%, #f5f9ff 100%);
        overflow: hidden;
      }

      .quiz-shell::before {
        content: "";
        position: absolute;
        inset: -20%;
        background: radial-gradient(circle at 20% 20%, rgba(13, 110, 253, 0.08), transparent 45%),
          radial-gradient(circle at 80% 75%, rgba(111, 66, 193, 0.08), transparent 45%);
        animation: drift 14s linear infinite alternate;
        pointer-events: none;
      }

      .quiz-shell > * {
        position: relative;
        z-index: 1;
      }

      .question-section {
        flex: 0 0 var(--question-basis);
        background: linear-gradient(180deg, #ffffff, #f8f9fa);
      }

      .answers-section {
        flex: 1;
        background: #f8f9fa;
        padding-inline: clamp(0.5rem, 1.5vmin, 1rem);
        padding-top: clamp(0.75rem, 2.2vmin, 1.25rem);
        padding-bottom: max(clamp(1rem, 3.5vmin, 1.75rem), calc(env(safe-area-inset-bottom) + 1rem));
      }

      .question-text {
        max-width: 90%;
        margin-inline: auto;
        font-size: clamp(1.15rem, 2.4vmin, 2rem);
        transition: opacity 240ms ease, transform 240ms ease;
      }

      .meta-pill {
        font-size: clamp(0.7rem, 0.9vmax, 0.86rem);
      }

      .host-line {
        color: #495057;
        margin-inline: auto;
        text-align: center;
        font-size: clamp(0.78rem, 1vmax, 0.95rem);
      }

      .answers-grid {
        height: 100%;
      }

      .answers-grid > .col {
        flex: 0 0 50%;
        width: 50%;
      }

      .answer-btn {
        height: 100%;
        width: 100%;
        min-height: 52px;
        font-size: clamp(0.78rem, 1.05vmax, 1.05rem);
        transition: transform 180ms ease, box-shadow 180ms ease, background-color 180ms ease, border-color 180ms ease;
      }

      .answer-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 8px 18px rgba(13, 110, 253, 0.12);
      }

      .answer-btn.is-correct {
        background-color: #198754;
        border-color: #198754;
        color: #fff;
      }

      .timer-wrap {
        position: absolute;
        top: var(--question-basis);
        left: 50%;
        transform: translate(-50%, -50%);
        width: min(88%, 700px);
        z-index: 20;
        background: rgba(255, 255, 255, 0.95);
        border: clamp(1px, 0.25vmin, 2px) solid #dee2e6;
        border-radius: 999px;
        padding: clamp(0.3rem, 0.9vmin, 0.45rem);
        transition: box-shadow 200ms ease, transform 200ms ease;
      }

      .timer-wrap.urgent {
        box-shadow: 0 0 0 0.2rem rgba(220, 53, 69, 0.15), 0 0.35rem 0.85rem rgba(220, 53, 69, 0.26);
        animation: pulse 0.75s ease-in-out infinite alternate;
      }

      .timer-label {
        font-weight: 600;
        font-size: clamp(0.72rem, 0.9vmax, 0.9rem);
      }

      .progress {
        height: clamp(0.55rem, 1.2vmin, 0.85rem);
      }

      .progress-bar {
        font-size: 0;
        line-height: 1;
      }

      .quiz-shell.is-transitioning .question-text,
      .quiz-shell.is-transitioning .host-line,
      .quiz-shell.is-transitioning .answers-grid {
        opacity: 0;
        transform: translateY(8px);
      }

      @keyframes pulse {
        from {
          transform: translate(-50%, -50%) scale(1);
        }
        to {
          transform: translate(-50%, -50%) scale(1.02);
        }
      }

      @keyframes drift {
        from {
          transform: translate3d(0, 0, 0) scale(1);
        }
        to {
          transform: translate3d(2.6%, -2.2%, 0) scale(1.05);
        }
      }

      @media (orientation: portrait) {
        .quiz-shell {
          --question-basis: 32%;
        }

        .question-section {
          flex-basis: var(--question-basis);
        }

        .answers-grid {
          height: auto;
        }

        .answers-section {
          padding-top: clamp(0.9rem, 2.8vmin, 1.4rem);
          padding-bottom: max(clamp(1.4rem, 5vmin, 2.5rem), calc(env(safe-area-inset-bottom) + 1.25rem));
        }

        .answers-grid > .col {
          flex: 0 0 100%;
          width: 100%;
        }

        .answer-btn {
          min-height: 56px;
        }
      }

      @media (orientation: landscape) {
        .quiz-shell {
          --question-basis: 34%;
        }

        .question-section {
          flex-basis: var(--question-basis);
        }

        .answers-grid {
          height: 100%;
        }

        .answers-grid > .col {
          flex: 0 0 50%;
          width: 50%;
        }
      }
    </style>
  </head>
  <body>
    <main class="app-root">
      <section class="quiz-shell d-flex flex-column">
        <div class="question-section d-flex flex-column justify-content-center text-center p-3 p-md-4 gap-2">
          <div class="d-flex justify-content-between align-items-center">
            <span id="questionPill" class="badge text-bg-dark rounded-pill meta-pill">Question 1 / 5</span>
            <span class="meta-pill" aria-hidden="true"></span>
          </div>
          <h1 id="questionText" class="question-text fw-semibold mb-0">
            Which option best describes Bootstrap's primary purpose in web development?
          </h1>
          <div id="hostLine" class="host-line fw-medium">Get ready! Watch answers reveal automatically.</div>
        </div>

        <div class="answers-section">
          <div class="answers-grid row g-2 g-md-3 h-100 m-0">
            <div class="col"><button id="answer0" class="btn btn-outline-primary answer-btn">A.</button></div>
            <div class="col"><button id="answer1" class="btn btn-outline-primary answer-btn">B.</button></div>
            <div class="col"><button id="answer2" class="btn btn-outline-primary answer-btn">C.</button></div>
            <div class="col"><button id="answer3" class="btn btn-outline-primary answer-btn">D.</button></div>
          </div>
        </div>

        <div class="timer-wrap shadow-sm">
          <div class="d-flex justify-content-between align-items-center mb-1 px-1">
            <span class="timer-label">Time Remaining</span>
            <span id="timerText" class="timer-label">30s</span>
          </div>
          <div class="progress" role="progressbar" aria-label="Question timer" aria-valuemin="0" aria-valuemax="30" aria-valuenow="30">
            <div id="timerBar" class="progress-bar progress-bar-striped progress-bar-animated" style="width: 100%"></div>
          </div>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const questionBank = [
        {
          question: "Which option best describes Bootstrap's primary purpose in web development?",
          answers: ["Database Management", "Responsive UI Design", "Machine Learning Model", "API Gateway Only"],
          correctIndex: 1,
          host: "Clean layouts win on every device."
        },
        {
          question: "What does CSS primarily control in a webpage?",
          answers: ["Data storage", "Application routing", "Visual presentation", "Server load balancing"],
          correctIndex: 2,
          host: "Looks matter—CSS shapes the user experience."
        },
        {
          question: "Which JavaScript method converts JSON text into an object?",
          answers: ["JSON.stringify", "JSON.parse", "Object.fromJSON", "JSON.convert"],
          correctIndex: 1,
          host: "Parsing text into objects keeps data usable."
        },
        {
          question: "Which HTML element is best for the main page heading?",
          answers: ["<h1>", "<header>", "<title>", "<strong>"],
          correctIndex: 0,
          host: "Strong semantics improve accessibility and SEO."
        },
        {
          question: "Why is responsive design important?",
          answers: ["It reduces JavaScript size only", "It avoids using media queries", "It adapts layouts to different screens", "It removes the need for testing"],
          correctIndex: 2,
          host: "One interface, many screen sizes."
        }
      ];

      const totalSeconds = 12;
      const revealAtSeconds = 4;
      let remaining = totalSeconds;
      let questionIndex = 0;
      let revealDone = false;
      const timerBar = document.getElementById("timerBar");
      const timerText = document.getElementById("timerText");
      const progressEl = document.querySelector(".progress");
      const timerWrap = document.querySelector(".timer-wrap");
      const quizShell = document.querySelector(".quiz-shell");
      const questionText = document.getElementById("questionText");
      const questionPill = document.getElementById("questionPill");
      const hostLine = document.getElementById("hostLine");
      const answerButtons = [0, 1, 2, 3].map((index) => document.getElementById(`answer${index}`));

      const clearAnswerState = () => {
        answerButtons.forEach((button) => {
          button.classList.remove("is-correct");
          button.disabled = false;
        });
      };

      const renderQuestion = () => {
        const current = questionBank[questionIndex];
        questionText.textContent = current.question;
        hostLine.textContent = current.host;
        questionPill.textContent = `Question ${questionIndex + 1} / ${questionBank.length}`;

        answerButtons.forEach((button, index) => {
          const optionLabel = String.fromCharCode(65 + index);
          button.textContent = `${optionLabel}. ${current.answers[index]}`;
        });
      };

      const revealAnswer = () => {
        if (revealDone) {
          return;
        }

        const current = questionBank[questionIndex];
        revealDone = true;

        answerButtons.forEach((button, index) => {
          button.disabled = true;
          if (index === current.correctIndex) {
            button.classList.add("is-correct");
          }
        });

        hostLine.textContent = "Time up! Correct answer highlighted.";
      };

      const runTransition = () => {
        quizShell.classList.add("is-transitioning");
        setTimeout(() => {
          quizShell.classList.remove("is-transitioning");
        }, 260);
      };

      const nextQuestion = () => {
        questionIndex = (questionIndex + 1) % questionBank.length;
        remaining = totalSeconds;
        revealDone = false;
        timerBar.classList.remove("bg-danger");
        timerBar.classList.add("bg-primary", "progress-bar-animated");
        timerWrap.classList.remove("urgent");
        clearAnswerState();
        runTransition();
        renderQuestion();
      };

      const tick = () => {
        const percent = Math.max(0, Math.round((remaining / totalSeconds) * 100));
        timerBar.style.width = `${percent}%`;
        timerBar.textContent = "";
        timerText.textContent = `${remaining}s`;
        progressEl.setAttribute("aria-valuenow", String(remaining));
        progressEl.setAttribute("aria-valuemax", String(totalSeconds));

        if (remaining <= revealAtSeconds) {
          timerBar.classList.add("bg-danger");
          timerWrap.classList.add("urgent");
        }

        if (remaining === revealAtSeconds) {
          revealAnswer();
        }

        if (remaining <= 0) {
          timerBar.classList.remove("progress-bar-animated");
          setTimeout(nextQuestion, 420);
          return;
        }

        remaining -= 1;
      };

      timerBar.classList.add("bg-primary");
      renderQuestion();
      tick();
      const timerInterval = setInterval(tick, 1000);
    </script>
  </body>
</html>
